name: Validate public network catalogue
on:
  pull_request:
    paths: ['data/network/**', 'scripts/validate_network_catalog.py', '.github/workflows/validate-network-catalog.yml']
  push:
    branches: [main]
    paths: ['data/network/**', 'scripts/validate_network_catalog.py', '.github/workflows/validate-network-catalog.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Ed25519 verification dependency
        run: python -m pip install 'cryptography>=44,<48'
      - name: Validate CSV schema and signed manifests
        run: python scripts/validate_network_catalog.py
