name: Feature request
description: Suggest an improvement to MDM SystemCheck
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "This issue is public. Do not share sensitive data."
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
    validations:
      required: true
